name: uji-belajar
# The adaptive filter (ML CatBoost retrained by the CatBoost program + deep learning in Rust) against the frozen
# filter, in the bot's own simulator, on the same data (research windows 18 Sep - 16 Oct, one continuous account):
# first half (18 Sep - 2 Oct), second half (2 - 16 Oct, fresh account and fresh learner), full; settings A and B.
# Runs on GitHub's machines. Nothing is traded.
on:
  workflow_dispatch:
  push:
    branches: [belajar-adaptif]
permissions:
  contents: read

jobs:
  banding:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: free disk (the merged dataset is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h . ; free -g ; nproc
      - run: sudo apt-get install -y -qq pkg-config libssl-dev zstd time
      - name: CatBoost program (the installer's own script)
        run: sudo deploy/catboost.sh /opt/rhc/bin/catboost && /opt/rhc/bin/catboost --help | head -3 || true
      - name: build + unit tests
        run: |
          cargo build --release --locked
          cargo test --release --locked -p rhc-trader belajar 2>&1 | tail -15
      - name: research data (sparse clone)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/horiii726-debug/meme-coin-robinhood-final riset
          cd riset
          git sparse-checkout set --no-cone $(for n in $(seq -w 0 14); do for f in pools.csv swaps_sorted.csv liq.csv trades.jsonl swaps_m1.json transfers.json dev_creator.json; do printf '/data/w%s/%s.zst* ' "$n" "$f"; done; done)
          git checkout
          du -sh data
      - name: adaptive vs frozen in the bot's simulator
        run: bash .github/uji/banding_belajar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil
          path: hasil/
          retention-days: 7
