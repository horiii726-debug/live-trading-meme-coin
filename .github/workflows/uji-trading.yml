name: uji-trading
# Does the installed bot actually trade? Installs exactly like the README, then lets the bot run on the live chain
# for a few hours and reports what it did: pools screened, buy orders the strategy handed to the executor (and how
# old they were), why buys were skipped, RPC health. Run in EXEC_MODE=shadow: every real order is built and signed;
# nothing is ever broadcast (the wallet is a fresh random key with no ETH anyway). Shadow's on-chain simulation
# needs debug_traceCall, which the free public RPC lacks, so there the last step reports that instead.
on:
  workflow_dispatch:
    inputs:
      menit:
        description: paling lama berapa menit bot diamati
        default: "280"
      trade:
        description: berhenti setelah sekian trade selesai
        default: "10"
  # a push to this branch starts an observation of that commit (workflow_dispatch needs the file on main first)
  push:
    branches: [uji-trading]
permissions:
  contents: read

jobs:
  amati:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: install — the README's one line
        run: |
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/mulai.sh"
          if [ "$GITHUB_REF_NAME" != main ]; then
            sudo git clone -q -b "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" /root/live-trading-meme-coin
          fi
          python3 .github/uji/ketik.py "curl -sSL $url | sudo env -u SUDO_USER -u SUDO_UID -u SUDO_GID HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash"

      - name: switch to shadow (build + sign every order, never broadcast)
        run: |
          sudo sed -i 's/^EXEC_MODE=.*/EXEC_MODE=shadow/' /opt/rhc/bot/.env
          # test only: retrain the ML half after 10 outcomes (not 300) so the CatBoost path runs within the observation
          echo "BELAJAR_LABEL_BARU=10" | sudo tee -a /opt/rhc/bot/.env
          # test only: start the strategy account at $100 (the owner's deposit) instead of the typed 1.000
          sudo sed -i 's/^START_USD=.*/START_USD=100/' /opt/rhc/bot/.env
          sudo systemctl stop rhc-trader
          sudo deploy/bersihkan-live.sh --reset-akun
          sudo systemctl start rhc-trader
          for i in $(seq 1 60); do sleep 5; [ "$(systemctl is-active rhc-trader)" = active ] && break; done
          systemctl is-active rhc-trader
          # the bot must stay up after the reset: no restarts in the first minute, else show why and stop the test
          sleep 60
          r=$(systemctl show -p NRestarts --value rhc-trader); echo "restarts after reset: $r"
          if [ "${r:-0}" -gt 0 ]; then sudo journalctl -u rhc-trader -n 60 --no-pager; exit 1; fi
          # time -> block map for the fill check (realita.py): once a second, the block the bot had processed and its lag
          sudo nohup bash -c 'while :; do python3 -c "import json,time;d=json.load(open(\"/opt/rhc/bot/rust_live/status.json\"));print(int(time.time()*1000),d[\"last_block\"],d[\"lag_blocks\"])" 2>/dev/null; sleep 1; done >> /tmp/sampler.txt' >/dev/null 2>&1 &

      - name: observe the bot on the live chain
        run: |
          total=${{ github.event.inputs.menit || '320' }}
          target=${{ github.event.inputs.trade || '10' }}
          for i in $(seq 1 $((total / 5))); do
            sleep 300
            echo "=== $((i * 5)) menit — service: $(systemctl is-active rhc-trader), restarts: $(systemctl show -p NRestarts --value rhc-trader)"
            sudo python3 -c "import json;d=json.load(open('/opt/rhc/bot/rust_live/status.json'));a=d['akun'];f=d.get('filter',{});print('blok',d['last_block'],'lag',d['lag_blocks'],'aman',d.get('mode_aman'),'| dibeli',a['trade_dibeli'],'selesai',a['trade_selesai'],'menang',a['menang'],'| dinilai',f.get('koin_dinilai'),'dipelajari',f.get('hasil_koin_dipelajari'),'ML dilatih',f.get('ml_dilatih_ulang'),'akurasi',f.get('akurasi_data_belum_dilihat_500'))" || true
            r=$(systemctl show -p NRestarts --value rhc-trader)
            if [ "${r:-0}" -gt 3 ]; then echo "GAGAL: bot restart $r kali"; sudo journalctl -u rhc-trader -n 60 --no-pager; exit 1; fi
            n=$(sudo python3 -c "import json;print(json.load(open('/opt/rhc/bot/rust_live/status.json'))['akun']['trade_selesai'])" 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge "$target" ]; then echo "target $target trade selesai tercapai"; break; fi
          done

      - name: report
        if: always()
        run: |
          sudo python3 .github/uji/laporan.py /opt/rhc/bot
          sudo python3 .github/uji/cek_komponen.py /opt/rhc/bot ${{ github.event.inputs.trade || '10' }}
          echo "--------------------------------------------------------------- live.log (60 baris terakhir)"
          sudo tail -n 60 /opt/rhc/bot/rust_live/live.log

      - name: realita — would the orders have filled against the other bots?
        if: always()
        continue-on-error: true
        run: |
          sudo python3 .github/uji/realita.py /opt/rhc/bot /tmp/sampler.txt | tee realita.json
          mkdir -p hasil && cp realita.json /tmp/sampler.txt hasil/
          # the bot keeps writing while this runs: "file changed as we read it" (exit 1) is expected
          sudo tar -czf hasil/rust_live.tar.gz --warning=no-file-changed -C /opt/rhc/bot --exclude='rust_live/rust_live_backup_*' rust_live || [ $? -eq 1 ]
          sudo chown -R "$USER" hasil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-realita
          path: hasil/
          retention-days: 30

      - name: kill switch — an injected error stops every order, survives a restart, resumes only on request
        run: |
          E=/opt/rhc/bot/.env; L=/opt/rhc/bot/rust_live; K=$L/KILL_SWITCH; S=$L/status.json
          sudo test ! -e $K || { echo "GAGAL: kill switch menyala pada bot sehat"; sudo cat $K; exit 1; }
          echo "UJI_PANIK_DETIK=20" | sudo tee -a $E >/dev/null
          sudo systemctl restart rhc-trader
          for i in $(seq 1 36); do sleep 5; sudo test -e $K && break; done
          sudo test -e $K || { echo "GAGAL: error sengaja tidak menyalakan kill switch"; exit 1; }
          echo "--- isi KILL_SWITCH"; sudo cat $K
          sleep 15
          [ "$(systemctl is-active rhc-trader)" = active ] || { echo "GAGAL: bot mati / restart terus saat kill switch"; exit 1; }
          sudo python3 -c "import json;d=json.load(open('$S'));print('status.json kill_switch:',d['kill_switch']);assert d['kill_switch']['aktif']"
          s1=$(sudo grep -c '] SARING ' $L/live.log || true); o1=$(sudo sh -c "cat $L/exec*/journal.jsonl 2>/dev/null" | grep -c '"event":"order"' || true)
          sleep 90
          s2=$(sudo grep -c '] SARING ' $L/live.log || true); o2=$(sudo sh -c "cat $L/exec*/journal.jsonl 2>/dev/null" | grep -c '"event":"order"' || true)
          echo "keputusan koin $s1 -> $s2, order ke eksekutor $o1 -> $o2 (90 dtk saat kill switch aktif)"
          [ "$s1" = "$s2" ] && [ "$o1" = "$o2" ] || { echo "GAGAL: masih ada keputusan / order saat kill switch aktif"; exit 1; }
          echo "--- restart: harus TETAP terkunci"
          sudo systemctl restart rhc-trader
          for i in $(seq 1 24); do sleep 5; sudo grep -q "KILL SWITCH MASIH AKTIF" $L/live.log && break; done
          sudo test -e $K && sudo grep -q "KILL SWITCH MASIH AKTIF" $L/live.log || { echo "GAGAL: restart membuka kill switch"; exit 1; }
          echo "--- pemilik melanjutkan (error sengaja dihapus dulu)"
          sudo sed -i '/^UJI_PANIK_DETIK=/d' $E
          sudo bash -c 'cd /root/live-trading-meme-coin && ./rhc.sh lanjut --ya'
          sleep 45
          sudo test ! -e $K || { echo "GAGAL: lanjut tidak membuka kill switch"; exit 1; }
          [ "$(systemctl is-active rhc-trader)" = active ] || { echo "GAGAL: bot tidak jalan lagi setelah lanjut"; exit 1; }
          sudo python3 -c "import json;d=json.load(open('$S'));print('status.json kill_switch:',d['kill_switch']);assert not d['kill_switch']['aktif']"
          echo "KILL SWITCH: LULUS (menyala karena error, semua order berhenti, tetap terkunci setelah restart, dibuka hanya dengan lanjut)"
