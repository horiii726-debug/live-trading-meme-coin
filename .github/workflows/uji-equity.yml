name: uji-equity
# Test only (branch uji-equity, never merged): the same backtest on main and on the fix branch, compared trade by trade.
on:
  workflow_dispatch:
  push:
    branches: [uji-equity]
permissions:
  contents: read

jobs:
  equity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - run: sudo apt-get install -y -qq pkg-config libssl-dev zstd
      - name: CatBoost program (the installer's own script)
        run: sudo deploy/catboost.sh /opt/rhc/bin/catboost
      - name: research data (sparse clone)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/horiii726-debug/meme-coin-robinhood-final riset
          cd riset
          git sparse-checkout set --no-cone $(for n in $(seq -w 0 14); do for f in pools.csv swaps_sorted.csv liq.csv trades.jsonl swaps_m1.json transfers.json dev_creator.json; do printf '/data/w%s/%s.zst* ' "$n" "$f"; done; done)
          git checkout
      - name: same backtest, both versions
        run: bash .github/uji/equity_jalan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equity-hasil
          path: hasil/
          retention-days: 14
