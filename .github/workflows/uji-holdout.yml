name: uji-holdout
# True hold-out: the adaptive filter vs the frozen one on data after 16 Oct 2026, which no setting was chosen on.
# Runs on GitHub's machines. Nothing is traded.
on:
  workflow_dispatch:
  push:
    branches: [uji-holdout]
permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq pkg-config libssl-dev
      - name: CatBoost program (the installer's own script)
        run: sudo deploy/catboost.sh /opt/rhc/bin/catboost
      - name: build + unit tests
        run: |
          cargo build --release --locked
          cargo test --release --locked -p rhc-trader belajar 2>&1 | tail -12
      - name: hold-out comparison
        run: bash .github/uji/banding_holdout.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil
          path: hasil/
          retention-days: 7
