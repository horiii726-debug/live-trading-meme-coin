; supervisor unit for containers without systemd (Docker, Vast.ai, LXC).
; Installed to /etc/supervisor/conf.d/rhc-trader.conf by deploy/install.sh.
; Load it with: supervisorctl reread && supervisorctl update
[program:rhc-trader]
environment=PROC_NAME="%(program_name)s"
command=/opt/rhc/bin/rhc-trader live --bot /opt/rhc/bot --env /opt/rhc/bot/.env
directory=/opt/rhc/bot
user=rhc
autostart=true
; "unexpected" so a deliberate `supervisorctl stop` stays stopped
autorestart=unexpected
startsecs=10
; a restart replays stored history WITHOUT trading it, then sells real positions the strategy dropped
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/portal/rhc-trader.log
redirect_stderr=true
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
